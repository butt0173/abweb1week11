<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
</head>
<body>
    <!-- AI prompt for basic structure: add a div wrapper with the class wrapper, 
     and inside add a header,nav,main, and footer. 
     Do not add any placeholder content. -->
    <div class="wrapper">
        <header>
            <h1>Intro to CSS Grid</h1>
        </header>
        <nav></nav>
        <main>
            <!-- AI prompt for basic structure: Inside the main, add four section, each with a class with a different
             number (one,two,etc.). Inside each section add an h2 with the text grid 1, grid 2, etc. (incrementing for 
             each section). Under the h2, add an article with 8 divs inside. in each div add a p tag with an incrementing 
             number (1-8 for each section).-->
            <section class="one">
                <h2>grid 1</h2>
                <article>
                    <div><p>1</p></div>
                    <div><p>2</p></div>
                    <div><p>3</p></div>
                    <div><p>4</p></div>
                    <div><p>5</p></div>
                    <div><p>6</p></div>
                    <div><p>7</p></div>
                    <div><p>8</p></div>
                </article>
            </section>
